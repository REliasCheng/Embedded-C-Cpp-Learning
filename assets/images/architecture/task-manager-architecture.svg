<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">Lightweight task manager architecture</title>
  <desc id="desc">A periodic tick scans a fixed task table, skips stopped or faulted tasks, invokes due callbacks and updates run counters.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57606a"/></marker>
    <style>
      .box{fill:#f6f8fa;stroke:#57606a;stroke-width:2;rx:12}.accent{fill:#fff8c5;stroke:#9a6700}.run{fill:#dafbe1;stroke:#1a7f37}.fault{fill:#ffebe9;stroke:#cf222e}.label{font:600 18px Arial,sans-serif;fill:#24292f;text-anchor:middle}.sub{font:14px Arial,sans-serif;fill:#57606a;text-anchor:middle}.line{stroke:#57606a;stroke-width:3;marker-end:url(#arrow2)}
    </style>
  </defs>
  <rect width="1100" height="340" fill="#ffffff"/>
  <rect class="box accent" x="35" y="120" width="140" height="90"/><text class="label" x="105" y="155">System tick</text><text class="sub" x="105" y="183">tick()</text>
  <rect class="box" x="235" y="80" width="210" height="170"/><text class="label" x="340" y="115">Fixed task table</text><text class="sub" x="340" y="145">period_ticks</text><text class="sub" x="340" y="170">remaining_ticks</text><text class="sub" x="340" y="195">state + callback</text><text class="sub" x="340" y="220">context + run_count</text>
  <rect class="box" x="505" y="120" width="160" height="90"/><text class="label" x="585" y="155">State gate</text><text class="sub" x="585" y="183">RUNNING only</text>
  <rect class="box run" x="725" y="55" width="150" height="90"/><text class="label" x="800" y="90">Due task</text><text class="sub" x="800" y="118">callback()</text>
  <rect class="box fault" x="725" y="200" width="150" height="90"/><text class="label" x="800" y="235">Stopped/Fault</text><text class="sub" x="800" y="263">skip callback</text>
  <rect class="box" x="935" y="55" width="135" height="90"/><text class="label" x="1002" y="90">Accounting</text><text class="sub" x="1002" y="118">reload + count</text>
  <line class="line" x1="175" y1="165" x2="230" y2="165"/><line class="line" x1="445" y1="165" x2="500" y2="165"/><line class="line" x1="665" y1="150" x2="720" y2="105"/><line class="line" x1="665" y1="180" x2="720" y2="235"/><line class="line" x1="875" y1="100" x2="930" y2="100"/>
</svg>
