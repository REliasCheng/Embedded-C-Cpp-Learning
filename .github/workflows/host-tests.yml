name: Host Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: ${{ matrix.compiler }} host tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run host tests
        run: python3 scripts/run_host_tests.py --compiler "${{ matrix.compiler }}"

  sanitizers:
    name: GCC ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run sanitizer tests
        run: python3 scripts/run_host_tests.py --compiler gcc --sanitizers
